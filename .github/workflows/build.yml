name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: echo "VERSION_NAME=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TgReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TgReader-apk
          path: TgReader.apk

      # Every push to main publishes (or refreshes) the release for the version in VERSION.
      # Bump VERSION to start a new release.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Озвучка каналу ${{ env.VERSION_NAME }}
          make_latest: true
          files: TgReader.apk
          body: |
            ### Як встановити
            1. Завантажте **TgReader.apk** нижче (розділ Assets).
            2. Відкрийте файл на телефоні й дозвольте встановлення з цього джерела.
            3. Вставте адресу публічного каналу, наприклад `@ukrpravda_news`, і натисніть ▶.

            Потрібен Android 8.0+. Якщо озвучка мовчить, встановіть український голос:
            Налаштування → Система → Мови → Синтез мовлення → Google → Встановити голосові дані → Українська.

            Збірка №${{ github.run_number }} (${{ github.sha }})
