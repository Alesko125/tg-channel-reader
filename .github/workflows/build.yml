name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: echo "VERSION_NAME=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TgReader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TgReader-apk
          path: TgReader.apk

      # A release is published once per version: bump VERSION (and RELEASE_NOTES.md) to ship an update.
      # version.json in the latest release is what installed apps check for updates.
      - name: Check whether this version is already released
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION_NAME already exists, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare update manifest
        if: steps.release.outputs.publish == 'true'
        run: |
          jq -n \
            --argjson code "${{ github.run_number }}" \
            --arg name "$VERSION_NAME" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION_NAME/TgReader.apk" \
            --arg sha "$(sha256sum TgReader.apk | cut -d' ' -f1)" \
            --arg notes "$(cat RELEASE_NOTES.md 2>/dev/null)" \
            '{version_code: $code, version_name: $name, apk_url: $url, sha256: $sha, mandatory: false, notes: $notes}' \
            > version.json
          cat version.json
          {
            cat RELEASE_NOTES.md 2>/dev/null
            echo
            echo "### Як встановити"
            echo "1. Завантажте **TgReader.apk** нижче (розділ Assets)."
            echo "2. Відкрийте файл на телефоні й дозвольте встановлення з цього джерела."
            echo "3. Вставте адресу публічного каналу, наприклад \`@ukrpravda_news\`, і натисніть ▶."
            echo
            echo "Потрібен Android 8.0+. Якщо озвучка мовчить, встановіть український голос:"
            echo "Налаштування → Система → Мови → Синтез мовлення → Google → Встановити голосові дані → Українська."
            echo
            echo "Далі застосунок сам повідомлятиме про нові версії."
          } > release-body.md

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Озвучка каналу ${{ env.VERSION_NAME }}
          make_latest: true
          body_path: release-body.md
          files: |
            TgReader.apk
            version.json
